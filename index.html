<!DOCTYPE html5>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copus</title>
    <link rel="icon" type="image/png" href="/assets/noti.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body class="body">
    <div class="container">
        <h1 class="main-text">copus file converter</h1>
        <h3 class="sub-text">convert mp3 files to opus/ogg</h3>

        <div class="upload-area" id="upload-area">
            <div class="upload-icon">
                <img src="./assets/upload.svg" alt="Upload Icon">
            </div>
            <h2>click to upload or drag a file into me</h2>
            <input type="file" id="fileElem" multiple accept=".mp3" style="display: none">
        </div>

        <div class="conversion-area">
            <div class="conversion-info">
            <div class="file-details">
                <h2 id="file-name" style="font-weight: 400; font-size: clamp(0.67rem, 0.41rem + 0.32rem, 2rem);">filename.mp3</h2>
            </div>
            <div class="file-size">
                <h3 id="file-size" style="font-style: italic; color: #0077ed; font-size: clamp(0.32rem, 2vw, 0.75rem); font-weight: 400;">0 MB</h3>
            </div>
            <div class="dropdown">
                <p>to: </p>
                <select name="formats">
                    <option value="opus">opus</option>
                    <option value="ogg">ogg</option>
                </select>
            </div>
            </div>
            <div>
            <p class="convert-button" id="convert-button">
            convert
            </p>
            </div>
        </div>

        <div class="download-area" id="download=area">
            <div class="download-info">
                <div class="file-details">
                    <h2 id="file-name" style="font-weight: 400; font-size: clamp(0.67rem, 0.25rem + 0.67rem, 2rem);">filename.mp3</h2>
                </div>
                <div class="file-size">
                    <h3 id="file-size" style="font-style: italic; color: #0077ed; font-size: clamp(0.41rem, 2.5vw, 1rem); font-weight: 500;">0 MB</h3>
                </div>
                <p class="convert-button">download</p>
            </div>
        </div>
    </div>    
</body>
</html>
